# Render Blueprint: a static site (no server code runs; the conversion happens in the visitor's browser)
services:
  - type: web
    name: RetroPortLabTools
    runtime: static
    staticPublishPath: webtool/site
    headers:
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
      - path: /*
        name: Cache-Control
        value: public, max-age=300
